name: Deploy to Netlify with Sentry

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Notify Sentry about deployment
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npx @sentry/cli releases new "v${{ github.sha }}"
          npx @sentry/cli releases set-commits "v${{ github.sha }}" --auto
          npx @sentry/cli releases finalize "v${{ github.sha }}"

      - name: Deploy to Netlify
        run: npm run deploy